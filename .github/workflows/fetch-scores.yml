name: Fetch World Cup Scores

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-scores
  cancel-in-progress: false

jobs:
  fetch-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch scores from football-data.org
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ]; then
            echo "FOOTBALL_DATA_TOKEN secret is not set." >&2
            echo "Register a free key at https://www.football-data.org/client/register" >&2
            echo "then add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          curl -s "https://api.football-data.org/v4/competitions/WC/matches?season=2026" \
            -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" \
            -o data.json.new \
            --fail \
            --max-time 25 \
            --retry 1 \
            --retry-delay 3
          # Refuse to clobber data.json with a truncated/invalid response.
          python3 -c "import json,sys; d=json.load(open('data.json.new')); assert len(d['matches']) >= 100, 'only %d matches' % len(d['matches']); print('Fetched', len(d['matches']), 'matches')"
          mv data.json.new data.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update scores $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Main may have moved (prediction edits) since checkout.
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push
